[package]
name = "laporan"
description = "Error handling library, split off from Xuehua's xh-reports"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["derive"]
std = []
derive = ["dep:laporan-derive"]
pretty = ["dep:owo-colors"]
serde = ["dep:serde", "dep:erased-serde"]
json = ["dep:serde_json", "serde"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "std"]
full = ["std", "derive", "pretty", "serde", "json", "tracing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
laporan-derive = { version = "0.2.0", path = "../laporan-derive", optional = true }
educe = { version = "0.8.2", default-features = false, features = ["Default", "Deref", "Clone"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"], optional = true }
serde = { version = "1.0.229", optional = true, default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", optional = true, default-features = false, features = ["alloc"] }
owo-colors = { version = "4.4.0", optional = true }
erased-serde = { version = "0.4.11", default-features = false, features = ["alloc"], optional = true }
