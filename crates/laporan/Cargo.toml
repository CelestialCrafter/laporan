[package]
name = "laporan"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Error handling library, split off from Xuehua's xh-reports"
homepage = "https://github.com/CelestialCrafter/laporan"
repository = "https://github.com/CelestialCrafter/laporan"

[features]
default = ["std", "derive", "pretty", "serde", "json", "tracing"]
# default = [ "derive" ]
std = []
derive = ["dep:laporan-derive"]
pretty = ["dep:owo-colors"]
serde = ["dep:serde", "dep:erased-serde"]
json = ["dep:serde_json", "serde"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "std"]

[dependencies]
laporan-derive = { version = "0.1.0", path = "../laporan-derive", optional = true }
educe = "0.8.1"
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
owo-colors = { version = "4.4.0", optional = true, features = ["supports-colors"] }
erased-serde = { version = "0.4.11", optional = true }
